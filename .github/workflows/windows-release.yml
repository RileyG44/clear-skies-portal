name: Windows installers
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths: ['electron/**', 'build/**', 'electron-builder*.js', 'package*.json', '.github/workflows/windows-release.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test test-desktop.js test-electron-startup.js
      - name: Build one-click and guided installers, plus portable ZIP
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged engine and create checksums
        run: node scripts/verify-windows-package.js
      - uses: actions/upload-artifact@v6
        with:
          name: ClearSkies-Windows
          path: |
            dist/ClearSkies-*.exe
            dist/ClearSkies-*.zip
            dist/SHA256SUMS-Windows.txt
  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: ClearSkies-Windows
          path: dist
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Clear Skies for Windows ${RELEASE_TAG#desktop-v}" --notes-file docs/WINDOWS_RELEASE.md
