name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only ever reads the tree.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Syntax-check the server and its modules
        run: |
          node --check server.js
          node --check cog.js
          node --check usgs.js

      - name: Confirm there are still no dependencies
        run: |
          test ! -d node_modules
          node -e "const p=require('./package.json'); if(p.dependencies||p.devDependencies) throw new Error('a dependency crept in'); console.log('zero deps')"

      - name: Unit-check the COG decoder against known values
        run: node test-cog.js

      - name: Syntax-check Python scripts
        run: python -m compileall -q trailcheck.py snowline.py probe.py

      - name: Validate sources.json
        run: python -c "import json; json.load(open('sources.json')); print('sources.json parses')"

      - name: Smoke-test the server
        run: |
          node server.js &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8765/api/health && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8765/api/health | tee /dev/stderr | grep -q '"ok":true'
          curl -sfI http://127.0.0.1:8765/ | head -1
