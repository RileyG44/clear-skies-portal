name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job receives Pages permissions only.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Validate the lockfile
        run: npm ci --ignore-scripts

      - name: Check, test, and audit
        run: npm run verify

      - name: Syntax-check Python scripts
        run: python -m compileall -q trailcheck.py

      - name: Test physical iPhone selection
        run: python -m unittest discover -s ios/scripts -p 'test_*.py' -v

  iphone-runner:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check iPhone runner without building or contacting devices
        run: |
          zsh -n ios/scripts/run-on-iphone.sh
          python3 -m unittest discover -s ios/scripts -p 'test_*.py' -v

  # The engine often runs on a Windows desktop, not the Mac: run the whole
  # suite there too, including the real server, worker pool and disk cache.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Check and test on Windows
        run: |
          npm run check
          npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/configure-pages@v6

      # Same posture as the check job: no lifecycle scripts. esbuild's platform
      # binary ships as an optional dependency, so it does not need one.
      - name: Install build tooling
        run: npm ci --ignore-scripts

      - name: Assemble the static site
        run: python3 scripts/assemble-site.py . _site

      # The repo stays readable (check-static asserts exact strings, and the tests
      # run against the sources); only the shipped bytes are compacted.
      - name: Minify the shipped bytes
        run: node scripts/minify-site.js _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
