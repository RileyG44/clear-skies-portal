name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job receives Pages permissions only.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Validate the lockfile
        run: npm ci --ignore-scripts

      - name: Check, test, and audit
        run: npm run verify

      - name: Syntax-check Python scripts
        run: python -m compileall -q trailcheck.py snowline.py probe.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Assemble the static site
        run: |
          mkdir _site
          cp index.html mosaic-core.js terrain-core.js elevation-bands.js elevation-tile-core.js glacial-research-core.js research-analysis.js research-worker.js version.js sw.js manifest.json icon-180.png icon-192.png icon-512.png .nojekyll _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
