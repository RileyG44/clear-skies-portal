[workspace]
resolver = "3"
members = ["crates/csk-core", "crates/csk-store", "crates/csk-engine", "crates/csk-cli", "crates/csk-ffi", "crates/csk-science", "crates/csk-gpu", "crates/csk-shader-tool"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Tests and tools: line tables are enough for backtraces, and keep the
# target directory small.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# Debug app builds: optimised (raster code is unusable unoptimised), without
# fat LTO, so an edit-build-run cycle stays quick.
[profile.app-dev]
inherits = "release"
lto = false
codegen-units = 16
debug = "line-tables-only"
panic = "unwind"
