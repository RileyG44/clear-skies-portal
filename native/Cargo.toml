[workspace]
resolver = "3"
members = ["crates/csk-core"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
