[package]
name = "csk-engine"
version = "0.1.0"
description = "ClearSkies in-app engine: sources, tiles, jobs and the LocalEngine router"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
csk-core = { path = "../csk-core" }
csk-store = { path = "../csk-store" }
csk-science = { path = "../csk-science" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
lru = "0.16"
percent-encoding = "2"
url = "2"
sha2 = "0.10"
zstd = { version = "0.13", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
