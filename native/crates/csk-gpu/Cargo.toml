[package]
name = "csk-gpu"
version = "0.1.0"
description = "ClearSkies native terrain rendering and shared shader toolchain"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
csk-core = { path = "../csk-core" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "wgsl"] }
thiserror = "2"
serde_json = "1"

[dev-dependencies]
pollster = "0.4"
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[lints]
workspace = true
