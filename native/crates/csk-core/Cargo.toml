[package]
name = "csk-core"
version = "0.1.0"
description = "ClearSkies native engine core: codecs, geodesy and tile formats"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lerc-rs = "=0.8.0"
miniz_oxide = "0.8"
zstd = { version = "0.13", default-features = false }
thiserror = "2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[lints]
workspace = true
