<style>
/* A field-sketchbook page shown on an e-ink screen: a plain white ground and near-black
   text. The maple and the
   section are one three.js canvas multiplied onto it, drawn for today's date. The page's
   accent is taken from the colour the canopy is today (set by the script below), muted
   the way a colour e-ink panel mutes it. */
:root{
  color-scheme:light;
  --paper:#fff;              /* plain white */
  --ink:#1d1e20;            /* e-ink black, the same as the drawing's pen */
  --ink-2:#383a3d;
  --grey:#55585c;
  --accent:#7d8a5a;         /* replaced with today's canopy colour */
  --accent-deep:#4c5638;
  --emerald:var(--accent-deep);
  --sepia:var(--grey);
  --brand:Fraunces,"Iowan Old Style",Georgia,serif;
  --hand:Kalam,"Segoe Print","Bradley Hand",cursive;
  --note:Caveat,Kalam,"Segoe Print",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--hand);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px dashed var(--emerald);outline-offset:5px;border-radius:6px}

/* the page: plain white, behind everything */
.paper{position:fixed;inset:0;z-index:-1;pointer-events:none;background-color:var(--paper)}

/* an e-ink panel's full refresh as the page arrives: one black flash, one white, then the page */
.refresh{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0}
@media (prefers-reduced-motion:no-preference){
  .refresh{animation:refresh .62s steps(1,end) .05s both}
  @keyframes refresh{0%{opacity:1;background:#1d1e20}22%{opacity:1;background:#c9cac5}38%{opacity:1;background:#f1f1ed}62%{opacity:.55;background:#fff}100%{opacity:0}}
}

/* everything inked shares one roughening filter and multiplies into the paper */
.inked{filter:url(#ink);mix-blend-mode:multiply}

.nav{position:absolute;top:0;right:0;z-index:3;display:flex;align-items:center;gap:clamp(16px,2.2vw,30px);
  padding:22px max(48px,env(safe-area-inset-right,0px)) 0 20px;font-size:clamp(15px,1.26vw,19px)}  /* same size as the tagline */
.nav a{text-decoration:none;position:relative;padding:4px 2px}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:2px;border-radius:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.nav a:hover::after{transform:scaleX(1)}

/* the letterhead and the drawing are one scene. The copy column is as wide as its text,
   the figure as wide as the tree's frame at the page's height (--fig-ratio, from maple.js
   viewFor), with one fixed gap between them, and the pair is centred inside an even inset,
   so a wider screen widens the margins around the scene, never the space inside it. The
   right inset is 28px less than the left: the drawing's notes stop about that far inside
   the figure, so the ink sits centred */
.sk{--fig-h:max(100svh,600px);--fig-ratio:.8562;--gap:clamp(16px,2.5vw,40px);--inset:max(24px,min(7.5vw,130px));
  display:grid;grid-template-columns:auto minmax(0,calc(var(--fig-h) * var(--fig-ratio)));column-gap:var(--gap);
  justify-content:center;padding:0 calc(var(--inset) - 28px) 0 var(--inset);min-height:100svh}
/* letterhead: the title's top sits level with the tree's tip and the buttons' bottom with the
   foot of the andesite; the script below sets --head-top and --foot from the drawing */
.copy{--title-drop:0px;--title-fs:clamp(52px,5.98vw,100px);display:flex;flex-direction:column;align-items:flex-start;padding:var(--head-top,96px) clamp(16px,2vw,32px) var(--foot,72px) 0;max-width:640px}
.title{display:inline-block;white-space:nowrap;font-family:var(--brand);font-weight:450;font-variation-settings:"opsz" 72;color:var(--ink);margin:var(--title-drop,0px) 0 .12em -.05em;
  padding:0 .08em .06em .02em;font-size:calc(.98 * var(--title-fs));line-height:calc(1.15 * var(--title-fs));letter-spacing:-.012em}
/* downloads: notebook entries in the space between the letterhead and the buttons */
/* sits about 3/4 inch (72px) under the title; the rest of the gap stays below it */
.dl{margin:calc(24px - clamp(14px,3.4vh,36px) + clamp(26px,5vh,56px) - .15*var(--title-fs)) 0 auto;display:grid;gap:0;width:min(100%,32em)}
.dl-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px .45em;padding:clamp(14px,3.4vh,36px) 0}
.mobile .dl-desktop{display:none}
.dl-k{margin:0;font-size:clamp(16px,1.32vw,20px);font-weight:300;color:var(--ink-2)}
.dl-links{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px 0}
.dl-comma{font-size:calc(.72 * clamp(20px,1.6vw,24px));font-weight:300;color:var(--grey);margin-right:.45em}
.dl-sep{color:var(--ink-2);font-weight:300;font-size:clamp(16px,1.32vw,20px)}
.dl-link{display:inline-flex;align-items:baseline;gap:.45em;font-size:clamp(20px,1.6vw,24px);font-weight:700;color:var(--emerald);text-decoration:none}

/* the platform line is the link: same small grey hand, lightly underlined */
.dl-meta{font-size:.72em;font-weight:300;color:var(--ink-2);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--accent) 60%,transparent);transition:text-decoration-color .25s}
.dl-link:hover .dl-meta{text-decoration-color:var(--accent-deep)}
.actions{margin-top:0;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.btn{display:inline-flex;align-items:center;gap:.5em;font-family:var(--hand);font-weight:700;font-size:clamp(16px,1.25vw,18px);line-height:1;
  text-decoration:none;padding:15px clamp(18px,1.7vw,26px) 13px;border-radius:255px 22px 225px 22px / 22px 225px 22px 255px;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),background-color .3s}
.btn:hover{transform:rotate(-.8deg) translateY(-1px)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{background:color-mix(in srgb,var(--ink) 82%,var(--accent-deep))}
.btn-ghost{border:2px solid var(--ink);color:var(--ink);padding:13px clamp(16px,1.6vw,24px) 11px;font-weight:400}
.btn-ghost:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}

/* the written-in entrance: each line of ink appears left to right */
@media (prefers-reduced-motion:no-preference){
  .write{-webkit-mask:linear-gradient(90deg,#000 45%,transparent 55%) 100% 0/230% 100% no-repeat;mask:linear-gradient(90deg,#000 45%,transparent 55%) 100% 0/230% 100% no-repeat;
    animation:write 1.4s cubic-bezier(.45,.1,.3,1) forwards;animation-delay:var(--d,0s)}
  @keyframes write{to{-webkit-mask-position:0 0;mask-position:0 0}}
}

.fig{position:relative;margin:0;height:100svh;min-height:600px;touch-action:pan-y}
.fig canvas{position:absolute;inset:0;width:100%;height:100%;display:block;mix-blend-mode:multiply}
.labels{position:absolute;inset:0;pointer-events:none;font-family:var(--note);color:#3e4144}
.lbl{position:absolute;white-space:nowrap;font-size:max(12px,calc(var(--u) * .027));line-height:1.05;opacity:0;transition:opacity 1.2s ease;filter:url(#ink);mix-blend-mode:multiply}
.lbl.on{opacity:.92}
.lbl.sec{color:var(--grey);font-size:max(12px,calc(var(--u) * .024))}
.lbl.sec b{font-weight:700;margin-right:.2em}
.lbl.sp{text-align:right;font-size:max(13px,calc(var(--u) * .03))}
.lbl.sp i{font-weight:600}
.lbl.cap{font-size:max(12px,calc(var(--u) * .025));color:var(--grey)}
.lbl.dim{font-size:max(12px,calc(var(--u) * .026))}
.lbl.season{color:var(--accent-deep)}
.lbl.sp-l{text-align:left}
.lbl.lr{text-align:right}
.nav a::after{background:var(--accent)}
.crow{position:fixed;left:0;top:0;z-index:6;pointer-events:none;display:none;will-change:transform}
.fig.nogl::after{content:"This sketch needs WebGL to draw.";position:absolute;inset:auto 0 50% 0;text-align:center;font-family:var(--note);font-size:24px;color:var(--sepia)}

@media (max-width:860px){
  .nav{position:static;justify-content:flex-start;padding:18px 20px 0 max(20px,env(safe-area-inset-left,0px));font-size:18px}
  .sk{grid-template-columns:1fr;min-height:0;padding:0}
  .copy{padding:28px 20px 8px;max-width:none}
  .copy{--title-fs:clamp(44px,12vw,55px)}.title{padding-right:.08em;--title-drop:0px}
  .dl{margin:4px 0 28px}
  .dl-row{padding:12px 0}
  .actions{margin-top:0}
  .fig{height:auto;min-height:0;aspect-ratio:var(--fig-ratio);overflow:clip}
}
@media (max-width:380px){.btn{padding:14px 20px 12px}.btn-ghost{padding:12px 18px 10px}}
</style>

<script type="module">
import { createSketch } from "./sketch.js";
import { buildMaple, viewFor } from "./maple.js";
import { pickSpecies } from "./maple-species.js";
import { pageDate } from "./phenology.js";
import { startCrow } from "./crow.js";
import { WIN, MAC, FILES, RELEASES_PAGE, refresh } from "./releases.js";
function links() {
  for (const a of document.querySelectorAll("[data-file]")) a.href = FILES[a.dataset.file];
  document.querySelector('[data-meta="mac"]').textContent = `Apple silicon, Version ${MAC.version}`;
  document.querySelector('[data-meta="win"]').textContent = `x64, Version ${WIN.version}`;
}
links();
refresh().then(n => n && links());
const copy = document.querySelector(".copy"), title = document.querySelector(".title"), wide = matchMedia("(min-width:861px)");
const meter = document.createElement("canvas").getContext("2d");
let last = null;
// distance from the top of the title's line box to the top of its tallest glyph
function glyphTop() {
  const cs = getComputedStyle(title), fs = parseFloat(cs.fontSize);
  meter.font = `${cs.fontWeight} ${fs}px ${cs.fontFamily}`;
  const m = meter.measureText(title.textContent), lh = parseFloat(cs.lineHeight) || fs;
  const asc = m.fontBoundingBoxAscent, desc = m.fontBoundingBoxDescent;
  return (lh - asc - desc) / 2 + asc - m.actualBoundingBoxAscent;
}
function align(pageY, a) {
  if (pageY) last = [pageY, a];
  if (!last) return;
  if (!wide.matches) { copy.style.removeProperty("--head-top"); copy.style.removeProperty("--foot"); return; }
  const [py, an] = last, top = copy.getBoundingClientRect().top + scrollY;
  copy.style.setProperty("--head-top", Math.max(16, py(an.tip) - top - glyphTop()) + "px");
  copy.style.setProperty("--foot", Math.max(16, top + copy.offsetHeight - py(an.rock)) + "px");
}
/* today's tree: a bigleaf or a vine maple, picked afresh on every load (?tree=bigleaf or
   ?tree=vine to choose). Only the picked tree's baked skeleton is downloaded. Its canopy
   colour becomes the page accent. */
const fig = document.getElementById("fig"), sk = document.querySelector(".sk"), fonts = Promise.all([document.fonts.load("450 60px Fraunces"), document.fonts.load("600 60px Caveat")]);
let scene = null;   // what is running: { sketch, crow }
async function boot() {
  const sp = pickSpecies();
  const { BAKED } = await sp.bake().catch(() => ({ BAKED: null }));   // (without the bake, the tree is grown here)
  const T = buildMaple(pageDate(), sp, BAKED), view = viewFor(sp);
  sk.style.setProperty("--fig-ratio", (view.w / view.h).toFixed(4));   // the figure takes the tree's frame
  {
    // a colour e-ink panel shows colour muted, towards its grey
    const g = (T.accent[0] + T.accent[1] + T.accent[2]) / 3, muted = T.accent.map(v => v + (g - v) * 0.35);
    const c = muted.map(v => Math.round(Math.min(1, v) * 255));
    const deep = muted.map(v => Math.round(Math.min(1, v) * 255 * 0.6));
    document.documentElement.style.setProperty("--accent", `rgb(${c.join(" ")})`);
    document.documentElement.style.setProperty("--accent-deep", `rgb(${deep.join(" ")})`);
  }
  fig.setAttribute("aria-label", fig.getAttribute("aria-label").replace(/sketch of an? [a-z ]*?maple,/, `sketch of a ${sp.alt},`));
  fig.dataset.tree = sp.id;
  window.__tree = T;
  const sketch = createSketch(document.getElementById("tree"), document.getElementById("labels"), {
    build: () => T, view,
    onNoWebGL() { fig.classList.add("nogl"); },
    onLayout: align
  });
  const me = scene = { sketch, crow: null };
  window.__sketch = sketch;
  await fonts;
  if (scene !== me) return;   // shut down before the fonts came
  align();
  me.crow = window.__crow = startCrow(title, { sketch, ground: T.ground, occluders: T.occluders });
}
/* when the page is left, the scene shuts down: the render loop, the GPU's buffers and
   textures, the WebGL context, the crow and every listener they hold. If the browser
   keeps the page and brings it back (back/forward), a fresh tree is picked and drawn on
   a fresh canvas. */
function shutdown() {
  if (!scene) return;
  const { sketch, crow } = scene; scene = null;
  if (crow) crow.stop();
  if (sketch) sketch.destroy();
  window.__sketch = window.__crow = window.__tree = null;
}
addEventListener("pagehide", shutdown);
addEventListener("pageshow", e => {
  if (!e.persisted || scene) return;
  const old = document.getElementById("tree"), cv = document.createElement("canvas");
  cv.id = "tree"; old.replaceWith(cv); fig.classList.remove("nogl");
  boot();
});
window.__shutdown = shutdown;
boot();
wide.addEventListener("change", () => align());
</script>
